<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Firetower — Coordinator Board</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid #333; }
    #banner { padding: 0.5rem 1.5rem; font-weight: 600; }
    #banner.online { background: #1b4d2e; }
    #banner.offline { background: #5c1a1a; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.6rem 1.5rem; border-bottom: 1px solid #222; }
    .EMERGENCY { color: #ff5c5c; font-weight: 700; }
    .PRIORITY { color: #ffb84d; font-weight: 700; }
    .WELFARE { color: #6fc3ff; }
    .ROUTINE { color: #9a9a9a; }
  </style>
</head>
<body>
  <header>
    <h1>Firetower</h1>
    <span id="banner">checking link...</span>
  </header>
  <table>
    <thead>
      <tr><th>Ticket</th><th>Urgency</th><th>Node</th><th>What</th><th>Where</th><th>Hurt</th><th>Status</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script src="/static/board.js"></script>
</body>
</html>
